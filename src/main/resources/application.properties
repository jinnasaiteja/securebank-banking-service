# ============================================================
# APPLICATION
# ============================================================

spring.application.name=banking-service

# Default local port.
# Docker can override this using SERVER_PORT.
server.port=${SERVER_PORT:8081}


# ============================================================
# MYSQL DATABASE
# ============================================================

# Local development:
# SecureBank runs in WSL.
# MySQL runs in Docker and is exposed on host port 3307.
#
# Docker Compose later:
# DB_URL will be changed to:
# jdbc:mysql://mysql:3306/securebank

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/securebank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.username=${DB_USERNAME:securebank}

spring.datasource.password=${DB_PASSWORD}
# ============================================================
# DATABASE CONNECTION POOL - HIKARI
# ============================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ============================================================
# JPA / HIBERNATE
# ============================================================

# Flyway controls the database schema.
# Hibernate must not automatically create or modify tables.
spring.jpa.hibernate.ddl-auto=none

# Prevent database sessions from remaining open
# through the web request lifecycle.
spring.jpa.open-in-view=false

# Keep SQL logging disabled normally.
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# FLYWAY DATABASE MIGRATIONS
# ============================================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=false


# ============================================================
# SPRING BOOT ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always

management.endpoint.health.probes.enabled=true


# ============================================================
# APPLICATION INFO
# ============================================================

management.info.env.enabled=true

info.app.name=SecureBank Banking Service
info.app.description=SecureBank banking transaction platform
info.app.version=1.0.0


# ============================================================
# LOGGING
# ============================================================

logging.level.root=INFO

logging.level.com.securebank.banking=INFO

logging.level.org.hibernate.SQL=INFO

logging.level.org.springframework.web=INFO
