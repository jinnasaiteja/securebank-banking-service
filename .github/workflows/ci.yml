name: SecureBank CI

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

permissions:
  contents: read
  packages: write

jobs:

  build-test:

    name: Build, Test and Docker Build

    runs-on: ubuntu-latest

    # =========================================================
    # MYSQL SERVICE
    # =========================================================
    services:

      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: securebank
          MYSQL_USER: securebank
          MYSQL_PASSWORD: securebank_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    steps:

      # =======================================================
      # CHECKOUT SOURCE CODE
      # =======================================================

      - name: Checkout source code
        uses: actions/checkout@v7


      # =======================================================
      # JAVA SETUP
      # =======================================================

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # =======================================================
      # VERIFY JAVA
      # =======================================================

      - name: Verify Java
        run: java -version


      # =======================================================
      # MAVEN WRAPPER PERMISSION
      # =======================================================

      - name: Make Maven wrapper executable
        run: chmod +x mvnw


      # =======================================================
      # VERIFY MYSQL
      # =======================================================

      - name: Verify MySQL port
        run: |
          python3 - <<'PY'
          import socket
          import sys

          host = "127.0.0.1"
          port = 3306

          try:
              with socket.create_connection((host, port), timeout=5):
                  print(f"MySQL is reachable at {host}:{port}")
          except Exception as e:
              print(f"Cannot reach MySQL: {e}")
              sys.exit(1)
          PY


      # =======================================================
      # MAVEN BUILD + TEST
      # =======================================================

      - name: Build and test application
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/securebank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: securebank
          DB_PASSWORD: securebank_ci_password

        run: ./mvnw --batch-mode clean verify


      # =======================================================
      # DOCKER BUILDX
      # =======================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # =======================================================
      # LOGIN TO GITHUB CONTAINER REGISTRY
      # Runs only when code is pushed.
      # Pull requests will build but will not publish images.
      # =======================================================

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # =======================================================
      # BUILD + PUSH DOCKER IMAGE
      # =======================================================

      - name: Build and push Docker image
        uses: docker/build-push-action@v7

        with:
          context: .

          # Push image only for actual pushes to dev.
          # Pull requests only test the Docker build.
          push: ${{ github.event_name == 'push' }}

          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
