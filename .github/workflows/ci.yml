name: SecureBank CI

on:
   push:
     branches:
       - dev
   pull_request:
     branches:
       - dev

permissions:
   contents: read

jobs:
  build-test:
    name: Build, Test and Docker Build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: securebank
          MYSQL_USER: securebank
          MYSQL_PASSWORD: securebank_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # -------------------------------------------------------
      # Checkout source code
      # -------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v7


      # -------------------------------------------------------
      # Install Java 21
      # -------------------------------------------------------

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # -------------------------------------------------------
      # Verify Java installation
      # -------------------------------------------------------

      - name: Verify Java
        run: java -version


      # -------------------------------------------------------
      # Make Maven wrapper executable
      # -------------------------------------------------------

      - name: Make Maven wrapper executable
        run: chmod +x mvnw


      # -------------------------------------------------------
      # Compile and run tests
      # -------------------------------------------------------

      - name: Build and test application
        run: ./mvnw --batch-mode clean verify


      # -------------------------------------------------------
      # Build Docker image
      # -------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t securebank-banking-service:${{ github.sha }} \
            .


